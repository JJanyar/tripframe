<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#17191E" />
    <meta name="description" content="Browse your dashcam footage by day and time, front and rear together. Everything stays on your computer." />
    <title>Tripframe</title>
    <meta property="og:site_name" content="Tripframe" />
    <meta name="application-name" content="Tripframe" />
    <link rel="icon" href="/favicon.ico?v=2" sizes="any" />
    <link rel="icon" href="/favicon.svg?v=2" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
    <link rel="manifest" href="/site.webmanifest" />
  </head>
  <body class="app-page">
    <a class="skip-link" href="#main" data-i18n="a.skip"></a>
    <div class="app" id="app">
      <aside class="sidebar" id="sidebar" data-i18n-attr="aria-label:app.filters">
        <a class="brand" href="/" data-i18n-attr="title:app.home;aria-label:app.home"><span class="brand-logo" data-logo></span></a>

        <button class="btn btn-primary btn-block" id="open-folder" type="button"></button>
        <p class="folder-name" id="folder-name" hidden></p>

        <div class="filters" id="filters" hidden>
          <fieldset class="filter-group">
            <legend data-i18n="app.camera"></legend>
            <div class="chips" id="filter-camera"></div>
          </fieldset>
          <fieldset class="filter-group">
            <legend data-i18n="app.type"></legend>
            <div class="chips" id="filter-type"></div>
          </fieldset>
          <div class="loud-scan">
            <button class="btn btn-block" id="loud-scan" type="button" data-i18n-attr="title:lib.loudTitle"></button>
            <label class="toggle" id="loud-only-wrap" hidden><input type="checkbox" id="loud-only" /> <span data-i18n="lib.loudOnly"></span></label>
            <p class="loud-status" id="loud-status" role="status"></p>
          </div>
          <nav class="days" data-i18n-attr="aria-label:app.days">
            <h2 class="filter-title" data-i18n="app.days"></h2>
            <div class="day-scroll" id="day-scroll">
              <span class="day-indicator" id="day-indicator" aria-hidden="true"></span>
              <ol class="day-list" id="day-list"></ol>
            </div>
          </nav>
        </div>

        <div class="sidebar-foot">
          <p class="local-note">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10V7a5 5 0 0 1 10 0v3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><rect x="4.5" y="10" width="15" height="11" rx="2.5" fill="currentColor"/></svg>
            <span data-i18n="app.local"></span>
          </p>
          <div class="prefs">
            <div id="theme-switch"></div>
            <label class="select compact">
              <span class="visually-hidden" data-i18n="lang.label"></span>
              <select id="lang"></select>
            </label>
          </div>
        </div>
      </aside>

      <main class="main" id="main">
        <header class="toolbar" id="toolbar" hidden>
          <div class="toolbar-title">
            <h1 id="library-title"></h1>
            <p id="library-meta"></p>
          </div>
          <div class="toolbar-actions">
            <label class="zoom" data-i18n-attr="title:app.zoom">
              <span class="visually-hidden" data-i18n="app.zoom"></span>
              <span class="zoom-icon small" aria-hidden="true"></span>
              <input type="range" id="zoom" min="180" max="420" step="10" value="260" />
              <span class="zoom-icon" aria-hidden="true"></span>
            </label>
            <label class="select">
              <span class="visually-hidden" data-i18n="app.sort"></span>
              <select id="sort">
                <option value="desc" data-i18n="app.sortDesc"></option>
                <option value="asc" data-i18n="app.sortAsc"></option>
              </select>
            </label>
          </div>
        </header>

        <section class="empty" id="empty">
          <div class="drop" id="drop">
            <div class="drop-art" aria-hidden="true">
              <div class="drop-tile"></div>
              <div class="drop-tile"></div>
              <div class="drop-tile"></div>
            </div>
            <h1 data-i18n="empty.title"></h1>
            <p data-i18n-html="empty.body"></p>
            <div class="drop-actions">
              <button class="btn btn-primary btn-large" id="open-folder-big" type="button" data-i18n="empty.choose"></button>
              <button class="btn btn-large" id="reopen" type="button" hidden></button>
            </div>
            <p class="drop-hint" id="drop-hint" data-i18n="empty.hint"></p>
          </div>
        </section>

        <section class="loading" id="loading" hidden aria-live="polite">
          <div class="spinner" aria-hidden="true"></div>
          <p id="loading-text"></p>
        </section>

        <section class="library" id="library" hidden></section>
        <input type="file" id="folder-input" webkitdirectory directory multiple hidden />
      </main>
      <div class="drop-overlay" aria-hidden="true" data-i18n="drop.release"></div>
    </div>

    <div class="viewer force-dark" id="viewer" role="dialog" aria-modal="true" aria-labelledby="viewer-title" hidden>
      <header class="viewer-bar">
        <button class="btn btn-ghost" id="viewer-close" type="button" data-i18n-attr="title:v.backTitle"></button>
        <div class="viewer-heading">
          <h2 id="viewer-title"></h2>
          <p id="viewer-sub"></p>
        </div>
        <div class="viewer-tools">
          <div class="segmented" id="layout-switch" role="radiogroup" data-i18n-attr="aria-label:v.layout"></div>
          <button class="btn btn-ghost" id="swap" type="button" data-i18n-attr="title:v.swapTitle"></button>
          <button class="btn btn-ghost" id="map-toggle" type="button" aria-pressed="false"></button>
          <button class="btn btn-ghost icon-only" id="hud-toggle" type="button" aria-pressed="false" data-i18n-attr="title:v.hudTitle"></button>
          <button class="btn btn-ghost icon-only" id="keys-toggle" type="button" popovertarget="keys-card" data-i18n-attr="title:k.title;aria-label:k.title"></button>
        </div>
      </header>

      <div class="viewer-body" id="viewer-body">
        <div class="stage" id="stage"></div>
        <aside class="map-panel" id="map-panel" hidden>
          <div class="map-bar">
            <div class="segmented" id="map-style" role="radiogroup" data-i18n-attr="aria-label:v.mapStyle"></div>
            <button class="btn btn-ghost icon-only" id="map-colours" type="button" aria-pressed="false" data-i18n-attr="title:v.speedColours"></button>
            <button class="btn btn-ghost icon-only" id="map-follow" type="button" aria-pressed="true" data-i18n-attr="title:v.follow"></button>
          </div>
          <div class="map-wrap">
            <div class="map" id="map"></div>
            <div class="map-legend" id="map-legend" hidden></div>
          </div>
          <div class="gps-readout" id="gps-readout"></div>
        </aside>
      </div>

      <footer class="controls" id="controls">
        <div class="scrub" id="scrub">
          <input type="range" id="scrubber" min="0" max="1000" step="1" value="0" data-i18n-attr="aria-label:v.position" />
          <span class="clip-range" id="clip-range" hidden></span>
          <div class="loud-marks" id="loud-marks"></div>
        </div>
        <div class="control-row">
          <div class="control-group transport">
            <button class="btn btn-ghost icon-only" id="prev-moment" type="button" data-i18n-attr="title:v.prevClip;aria-label:v.prevClip"></button>
            <button class="btn btn-ghost icon-only" id="frame-back" type="button" data-i18n-attr="title:v.frameBack;aria-label:v.frameBack"></button>
            <button class="btn btn-play icon-only" id="play" type="button" data-i18n-attr="title:v.playTitle"></button>
            <button class="btn btn-ghost icon-only" id="frame-fwd" type="button" data-i18n-attr="title:v.frameFwd;aria-label:v.frameFwd"></button>
            <button class="btn btn-ghost icon-only" id="next-moment" type="button" data-i18n-attr="title:v.nextClip;aria-label:v.nextClip"></button>
            <div class="volume">
              <button class="btn btn-ghost icon-only" id="mute" type="button" data-i18n-attr="title:v.muteTitle"></button>
              <input type="range" id="volume" min="0" max="100" step="1" value="100" data-i18n-attr="aria-label:v.volume" />
            </div>
            <p class="time" id="time"><span id="time-now">0:00.00</span><span class="time-sep">/</span><span id="time-total">0:00</span></p>
            <p class="frame-no" id="frame-no"></p>
          </div>
          <div class="control-group">
            <label class="select compact">
              <span class="visually-hidden" data-i18n="v.speed"></span>
              <select id="speed">
                <option value="0.25">0.25×</option>
                <option value="0.5">0.5×</option>
                <option value="1" selected>1×</option>
                <option value="2">2×</option>
                <option value="4">4×</option>
              </select>
            </label>
            <label class="toggle" data-i18n-attr="title:v.autoplayTitle">
              <input type="checkbox" id="autoplay" checked />
              <span data-i18n="v.autoplay"></span>
            </label>
            <div class="split-btn">
              <button class="btn" id="save-frame" type="button"></button>
              <button class="btn icon-only" id="still-toggle" type="button" popovertarget="still-card" data-i18n-attr="title:s.options;aria-label:s.options"></button>
            </div>
            <button class="btn icon-only" id="clip-toggle" type="button" popovertarget="clip-card" data-i18n-attr="title:c.titleKey;aria-label:c.title"></button>
            <button class="btn icon-only" id="loud" type="button" data-i18n-attr="title:a.findTitle;aria-label:a.find"></button>
            <button class="btn" id="record" type="button" data-i18n-attr="title:v.recordTitle"></button>
          </div>
        </div>
      </footer>
      <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

      <div class="keys-card tool-card force-dark" id="still-card" popover>
        <div class="keys-head">
          <h3 data-i18n="s.options"></h3>
          <button class="btn btn-ghost icon-only card-close" type="button" popovertarget="still-card" popovertargetaction="hide" data-i18n-attr="aria-label:k.close"></button>
        </div>
        <fieldset class="card-field">
          <legend data-i18n="s.format"></legend>
          <div class="radio-row" id="still-format"></div>
        </fieldset>
        <div class="card-field">
          <label class="inline-field"><span data-i18n="s.every"></span> <input type="number" id="still-every" min="0.1" max="600" step="0.1" value="1" /> <span data-i18n="s.seconds"></span></label>
          <p class="card-note" data-i18n="s.note"></p>
        </div>
        <div class="card-actions">
          <button class="btn btn-primary" id="still-run" type="button" data-i18n="s.start"></button>
          <p class="card-status" id="still-status" role="status"></p>
        </div>
      </div>

      <div class="keys-card tool-card force-dark" id="clip-card" popover>
        <div class="keys-head">
          <h3 data-i18n="c.title"></h3>
          <button class="btn btn-ghost icon-only card-close" type="button" popovertarget="clip-card" popovertargetaction="hide" data-i18n-attr="aria-label:k.close"></button>
        </div>
        <div class="card-grid">
          <span data-i18n="c.from"></span><output id="clip-in">0:00.00</output><button class="btn btn-ghost" id="clip-set-in" type="button" data-i18n="c.setNow"></button>
          <span data-i18n="c.to"></span><output id="clip-out">0:00.00</output><button class="btn btn-ghost" id="clip-set-out" type="button" data-i18n="c.setNow"></button>
        </div>
        <p class="card-note"><span data-i18n="c.keysNote"></span> <button class="link-btn" id="clip-clear" type="button" data-i18n="c.clear" hidden></button></p>
        <div class="card-field">
          <label class="inline-field"><span data-i18n="c.speed"></span>
            <select id="clip-speed">
              <option value="0.25">0.25×</option>
              <option value="0.5">0.5×</option>
              <option value="1" selected>1×</option>
              <option value="2">2×</option>
              <option value="4">4×</option>
            </select>
          </label>
        </div>
        <fieldset class="card-field">
          <legend data-i18n="c.direction"></legend>
          <div class="radio-row">
            <label><input type="radio" name="clip-dir" value="forward" checked /> <span data-i18n="c.forward"></span></label>
            <label><input type="radio" name="clip-dir" value="reverse" /> <span data-i18n="c.reverse"></span></label>
          </div>
        </fieldset>
        <label class="toggle"><input type="checkbox" id="clip-sound" checked /> <span data-i18n="c.sound"></span></label>
        <div class="card-actions">
          <button class="btn btn-primary" id="clip-run" type="button" data-i18n="c.export"></button>
          <p class="card-status" id="clip-status" role="status"></p>
        </div>
      </div>

      <div class="keys-card force-dark" id="keys-card" popover>
        <div class="keys-head">
          <h3 data-i18n="k.title"></h3>
          <button class="btn btn-ghost icon-only" type="button" popovertarget="keys-card" popovertargetaction="hide" data-i18n-attr="aria-label:k.close" id="keys-close"></button>
        </div>
        <dl class="keys-list" id="keys-list"></dl>
      </div>
    </div>

    <script type="module" src="/src/app.js"></script>
  </body>
</html>
