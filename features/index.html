<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#17191E" />
    <title>Features | Tripframe</title>
    <meta name="description" content="" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Tripframe" />
    <meta property="og:title" content="" />
    <meta property="og:description" content="" />
    <meta property="og:image" content="https://tripframe.vercel.app/video/tripframe.jpg" />
    <meta property="og:url" content="https://tripframe.vercel.app/features/" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="/favicon.ico?v=2" sizes="any" />
    <link rel="icon" href="/favicon.svg?v=2" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
    <link rel="manifest" href="/site.webmanifest" />
  </head>
  <body class="home page">
    <!--nav-->

    <main class="page-main">
      <header class="page-head">
        <h1 class="display-2" data-i18n="fe.title"></h1>
        <p class="body-l" data-i18n="fe.lead"></p>
        <nav class="page-jump" data-i18n-attr="aria-label:h.nav.label">
          <a href="#library" data-i18n="fe.library.short"></a>
          <a href="#playback" data-i18n="fe.play.short"></a>
          <a href="#frames" data-i18n="fe.frames.short"></a>
          <a href="#map" data-i18n="fe.map.short"></a>
          <a href="#data" data-i18n="fe.data.short"></a>
          <a href="#export" data-i18n="fe.export.short"></a>
          <a href="#keys" data-i18n="fe.keys.short"></a>
        </nav>
      </header>

      <section class="fe-block" id="library" aria-labelledby="library-title">
        <div class="fe-copy">
          <h2 class="headline" id="library-title" data-i18n="fe.library.title"></h2>
          <p class="body-l" data-i18n="fe.library.body"></p>
          <ul class="fe-list">
            <li data-i18n="fe.library.l1"></li>
            <li data-i18n="fe.library.l2"></li>
            <li data-i18n="fe.library.l3"></li>
            <li data-i18n="fe.library.l4"></li>
            <li data-i18n="fe.library.l5"></li>
          </ul>
        </div>
        <figure class="fe-media">
          <img src="/photos/dashcams-p1210466.jpg" width="1600" height="1200" alt="" data-i18n-attr="alt:h.alt.cams" loading="lazy" decoding="async" />
        </figure>
      </section>

      <section class="fe-block" id="playback" aria-labelledby="playback-title">
        <div class="fe-copy">
          <h2 class="headline" id="playback-title" data-i18n="h.sync.title"></h2>
          <p class="body-l" data-i18n="h.sync.body"></p>
          <ul class="fe-list">
            <li data-i18n="fe.play.l1"></li>
            <li data-i18n="fe.play.l2"></li>
            <li data-i18n="fe.play.l3"></li>
            <li data-i18n="fe.play.l4"></li>
          </ul>
        </div>
        <figure class="fe-media">
          <img src="/photos/georgia-i75nb-mm86-2-dashcam.jpg" width="1600" height="900" alt="" data-i18n-attr="alt:h.alt.highway" loading="lazy" decoding="async" />
        </figure>
      </section>

      <section class="fe-block" id="frames" aria-labelledby="frames-title">
        <div class="fe-copy">
          <h2 class="headline" id="frames-title" data-i18n="h.frame.title"></h2>
          <p class="body-l" data-i18n="h.frame.body"></p>
          <ul class="fe-list">
            <li data-i18n="fe.frames.l1"></li>
            <li data-i18n="fe.frames.l2"></li>
            <li data-i18n="fe.frames.l3"></li>
          </ul>
        </div>
        <figure class="fe-media">
          <img src="/photos/sb-ne-colin-kelley-highway-at-ne.jpg" width="1600" height="900" alt="" data-i18n-attr="alt:h.alt.intersection" loading="lazy" decoding="async" />
        </figure>
      </section>

      <section class="fe-block" id="map" aria-labelledby="map-title">
        <div class="fe-copy">
          <h2 class="headline" id="map-title" data-i18n="h.map.title"></h2>
          <p class="body-l" data-i18n="h.map.body"></p>
          <ul class="fe-list">
            <li data-i18n="fe.map.l1"></li>
            <li data-i18n="fe.map.l2"></li>
            <li data-i18n="fe.map.l3"></li>
            <li data-i18n="fe.map.l4"></li>
            <li data-i18n="fe.map.l5"></li>
          </ul>
        </div>
        <figure class="fe-media">
          <img src="/photos/sb-madison-highway-directional-road-sign-ga.jpg" width="1600" height="900" alt="" data-i18n-attr="alt:h.alt.sign" loading="lazy" decoding="async" />
        </figure>
      </section>

      <section class="fe-block fe-text" id="data" aria-labelledby="data-title">
        <div class="fe-copy">
          <h2 class="headline" id="data-title" data-i18n="fe.data.title"></h2>
          <p class="body-l" data-i18n="fe.data.body"></p>
        </div>
        <ul class="fe-list fe-cards">
          <li data-i18n="fe.data.l1"></li>
          <li data-i18n="fe.data.l2"></li>
          <li data-i18n="fe.data.l3"></li>
          <li data-i18n="fe.data.l4"></li>
        </ul>
      </section>

      <section class="fe-block fe-text" id="export" aria-labelledby="export-title">
        <div class="fe-copy">
          <h2 class="headline" id="export-title" data-i18n="fe.export.title"></h2>
          <p class="body-l" data-i18n="fe.export.body"></p>
        </div>
        <ul class="fe-list fe-cards">
          <li data-i18n="fe.export.l1"></li>
          <li data-i18n="fe.export.l2"></li>
          <li data-i18n="fe.export.l3"></li>
          <li data-i18n="fe.export.l4"></li>
        </ul>
      </section>

      <section class="fe-block fe-text" id="keys" aria-labelledby="keys-title">
        <div class="fe-copy">
          <h2 class="headline" id="keys-title" data-i18n="k.title"></h2>
          <p class="body-l" data-i18n="fe.keys.body"></p>
        </div>
        <dl class="key-table">
          <div><dt><kbd>Space</kbd></dt><dd data-i18n="k.play"></dd></div>
          <div><dt><kbd>,</kbd> <kbd>.</kbd></dt><dd data-i18n="k.frame"></dd></div>
          <div><dt><kbd>←</kbd> <kbd>→</kbd></dt><dd data-i18n="k.seek"></dd></div>
          <div><dt><kbd>↑</kbd> <kbd>↓</kbd></dt><dd data-i18n="k.clip"></dd></div>
          <div><dt><kbd>W</kbd></dt><dd data-i18n="k.swap"></dd></div>
          <div><dt><kbd>1</kbd> <kbd>2</kbd> <kbd>3</kbd></dt><dd data-i18n="k.layout"></dd></div>
          <div><dt><kbd>G</kbd></dt><dd data-i18n="k.map"></dd></div>
          <div><dt><kbd>H</kbd></dt><dd data-i18n="k.hud"></dd></div>
          <div><dt><kbd>T</kbd></dt><dd data-i18n="k.marker"></dd></div>
          <div><dt><kbd>S</kbd></dt><dd data-i18n="k.save"></dd></div>
          <div><dt><kbd>I</kbd> <kbd>O</kbd></dt><dd data-i18n="k.inout"></dd></div>
          <div><dt><kbd>R</kbd></dt><dd data-i18n="k.record"></dd></div>
          <div><dt><kbd>0</kbd></dt><dd data-i18n="k.zoom"></dd></div>
          <div><dt><kbd>M</kbd></dt><dd data-i18n="k.mute"></dd></div>
        </dl>
      </section>

      <section class="close">
        <h2 class="display" data-i18n="h.close.title"></h2>
        <a class="btn btn-primary btn-large" href="/app/" data-i18n="h.cta"></a>
      </section>
    </main>

    <!--footer-->

    <script type="module" src="/src/page.js"></script>
  </body>
</html>
