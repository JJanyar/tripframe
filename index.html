<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="google-site-verification" content="qwRuuv6yJwIumLH0zdr_8pfatkxHSnpb-L4ZI0nyHJY" />
    <meta name="theme-color" content="#17191E" />
    <title>Tripframe: every drive, frame by frame</title>
    <meta name="description" content="Open your dashcam's SD card in the browser. Every clip by day and time, front and rear in sync, frame by frame, with the route on a map. Free, no account, nothing is uploaded." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Tripframe" />
    <meta property="og:description" content="Every drive, frame by frame. Front and rear in sync, frame stepping, route on a map. Runs in your browser; nothing is uploaded." />
    <meta property="og:image" content="https://tripframe.vercel.app/video/tripframe.jpg" />
    <meta property="og:url" content="https://tripframe.vercel.app/" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="/favicon.ico?v=2" sizes="any" />
    <link rel="icon" href="/favicon.svg?v=2" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body class="home">
    <header class="nav" id="nav">
      <a class="wordmark" href="/" aria-label="Tripframe"><span data-logo></span></a>
      <nav class="nav-links" data-i18n-attr="aria-label:h.nav.label">
        <a href="#demo" data-i18n="h.nav.demo"></a>
        <a href="#how" data-i18n="h.nav.how"></a>
        <a href="#private" data-i18n="h.nav.privacy"></a>
        <a href="#faq" data-i18n="h.nav.faq"></a>
      </nav>
      <div class="nav-prefs">
        <div id="theme-switch"></div>
        <label class="select compact">
          <span class="visually-hidden" data-i18n="lang.label"></span>
          <select id="lang"></select>
        </label>
        <a class="btn btn-primary" href="/app/" data-i18n="h.cta.short"></a>
      </div>
    </header>

    <main>
      <section class="hero">
        <div class="hero-copy">
          <h1 class="display" data-i18n="h.hero.title"></h1>
          <p class="lead" data-i18n="h.hero.lead"></p>
          <div class="hero-actions">
            <a class="btn btn-primary btn-large" href="/app/" data-i18n="h.cta"></a>
            <a class="btn btn-large btn-quiet" href="#demo" data-i18n="h.cta.demo"></a>
          </div>
          <p class="hero-note" data-i18n="h.hero.note"></p>
        </div>
        <figure class="hero-video">
          <video id="hero-video" src="/video/tripframe.mp4" poster="/video/tripframe.jpg" width="1280" height="720" muted loop playsinline preload="metadata" data-i18n-attr="aria-label:h.video.label"></video>
          <button class="video-toggle" id="video-toggle" type="button"></button>
        </figure>
      </section>

      <section class="demo-section" id="demo" aria-labelledby="demo-title">
        <div class="section-head">
          <h2 class="headline" id="demo-title" data-i18n="h.demo.heading"></h2>
          <p class="body-l" data-i18n="h.demo.caption"></p>
        </div>
        <figure class="demo" data-ui id="demo-frame">
          <div class="demo-bar">
            <span class="demo-dots" aria-hidden="true"><i></i><i></i><i></i></span>
            <span class="demo-title">DCIM</span>
          </div>
          <div class="demo-body">
            <div class="demo-library" id="demo-library">
              <h3 class="demo-day" id="demo-day"></h3>
              <div class="demo-grid" id="demo-grid"></div>
            </div>
            <div class="demo-player force-dark" id="demo-player" hidden>
              <div class="demo-stage" id="demo-stage"></div>
              <div class="demo-controls">
                <button type="button" class="demo-btn" id="demo-back" data-i18n="h.demo.back"></button>
                <span class="demo-time" id="demo-time"></span>
                <button type="button" class="demo-btn" id="demo-swap" data-i18n="h.demo.swap"></button>
              </div>
            </div>
          </div>
        </figure>
      </section>

      <section class="moment" id="moment" aria-labelledby="moment-title">
        <div class="section-head">
          <h2 class="headline" id="moment-title" data-i18n="h.moment.title"></h2>
          <p class="body-l" data-i18n="h.moment.body"></p>
        </div>
        <ul class="decode" id="decode"></ul>
      </section>

      <section class="feature feature-sync" aria-labelledby="sync-title">
        <div class="feature-media pair">
          <img src="/photos/georgia-i75nb-mm86-2-dashcam.jpg" width="1600" height="900" alt="" data-i18n-attr="alt:h.alt.highway" loading="lazy" decoding="async" />
          <img src="/photos/sb-madison-highway-road-junction-ga-376.jpg" width="1600" height="900" alt="" data-i18n-attr="alt:h.alt.junction" loading="lazy" decoding="async" />
        </div>
        <div class="feature-copy">
          <h2 class="headline" id="sync-title" data-i18n="h.sync.title"></h2>
          <p class="body-l" data-i18n="h.sync.body"></p>
          <p class="keys"><kbd>W</kbd> <span data-i18n="h.sync.key"></span></p>
        </div>
      </section>

      <section class="feature feature-frame" aria-labelledby="frame-title">
        <div class="feature-copy">
          <h2 class="headline" id="frame-title" data-i18n="h.frame.title"></h2>
          <p class="body-l" data-i18n="h.frame.body"></p>
          <p class="keys"><kbd>,</kbd> <kbd>.</kbd> <span data-i18n="h.frame.key1"></span> <kbd>S</kbd> <span data-i18n="h.frame.key2"></span> <kbd>R</kbd> <span data-i18n="h.frame.key3"></span></p>
        </div>
        <div class="feature-media frames" id="frames">
          <img class="frames-big" src="/photos/sb-ne-colin-kelley-highway-at-ne.jpg" width="1600" height="900" alt="" data-i18n-attr="alt:h.alt.intersection" loading="lazy" decoding="async" />
          <div class="frame-strip" aria-hidden="true">
            <span style="--x: 40%"></span><span style="--x: 45%"></span><span class="on" style="--x: 50%"></span><span style="--x: 55%"></span><span style="--x: 60%"></span>
          </div>
        </div>
      </section>

      <section class="feature feature-map" aria-labelledby="map-title">
        <div class="feature-media route">
          <img src="/photos/sb-madison-highway-directional-road-sign-ga.jpg" width="1600" height="900" alt="" data-i18n-attr="alt:h.alt.sign" loading="lazy" decoding="async" />
          <div class="route-card force-dark" data-ui>
            <svg class="route-svg" viewBox="0 0 200 120" aria-hidden="true">
              <path class="route-path" d="M14 104 C 46 98, 52 70, 82 66 S 126 70, 140 46 S 170 18, 188 14" fill="none" />
              <circle class="route-dot" r="6" cx="14" cy="104" />
            </svg>
            <p class="route-speed"><span id="route-speed">0</span> <span class="unit" data-i18n="v.kmh"></span></p>
          </div>
        </div>
        <div class="feature-copy">
          <h2 class="headline" id="map-title" data-i18n="h.map.title"></h2>
          <p class="body-l" data-i18n="h.map.body"></p>
        </div>
      </section>

      <section class="private" id="private" aria-labelledby="private-title">
        <div class="private-inner">
          <h2 class="display-2" id="private-title" data-i18n="h.private.title"></h2>
          <div class="private-cols">
            <p class="body-l" data-i18n="h.private.body"></p>
            <ul class="private-list">
              <li data-i18n="h.private.p1"></li>
              <li data-i18n="h.private.p2"></li>
              <li data-i18n="h.private.p3"></li>
              <li data-i18n="h.private.p4"></li>
            </ul>
          </div>
        </div>
      </section>

      <section class="steps" id="how" aria-labelledby="steps-title">
        <h2 class="headline" id="steps-title" data-i18n="h.steps.title"></h2>
        <ol class="step-list">
          <li><h3 data-i18n="h.steps.1t"></h3><p data-i18n="h.steps.1"></p></li>
          <li><h3 data-i18n="h.steps.2t"></h3><p data-i18n-html="h.steps.2"></p></li>
          <li><h3 data-i18n="h.steps.3t"></h3><p data-i18n="h.steps.3"></p></li>
        </ol>
        <figure class="steps-photo">
          <img src="/photos/dashcams-p1210466.jpg" width="1600" height="1200" alt="" data-i18n-attr="alt:h.alt.cams" loading="lazy" decoding="async" />
        </figure>
      </section>

      <section class="faq" id="faq" aria-labelledby="faq-title">
        <h2 class="headline" id="faq-title" data-i18n="h.faq.title"></h2>
        <div class="faq-list">
          <details><summary data-i18n="h.faq.q1"></summary><p data-i18n="h.faq.a1"></p></details>
          <details><summary data-i18n="h.faq.q2"></summary><p data-i18n="h.faq.a2"></p></details>
          <details><summary data-i18n="h.faq.q3"></summary><p data-i18n="h.faq.a3"></p></details>
          <details><summary data-i18n="h.faq.q4"></summary><p data-i18n="h.faq.a4"></p></details>
          <details><summary data-i18n="h.faq.q5"></summary><p data-i18n="h.faq.a5"></p></details>
          <details><summary data-i18n="h.faq.q6"></summary><p data-i18n="h.faq.a6"></p></details>
          <details><summary data-i18n="h.faq.q7"></summary><p data-i18n="h.faq.a7"></p></details>
        </div>
      </section>

      <section class="close">
        <h2 class="display" data-i18n="h.close.title"></h2>
        <a class="btn btn-primary btn-large" href="/app/" data-i18n="h.cta"></a>
      </section>
    </main>

    <footer class="footer inverse">
      <div class="footer-inner">
        <a class="footer-logo" href="/" aria-label="Tripframe"><span data-logo></span></a>
        <div class="footer-cols">
          <p class="footer-line" data-i18n="h.footer.local"></p>
          <nav class="footer-links" data-i18n-attr="aria-label:h.nav.label">
            <a href="#demo" data-i18n="h.nav.demo"></a>
            <a href="#how" data-i18n="h.nav.how"></a>
            <a href="#private" data-i18n="h.nav.privacy"></a>
            <a href="#faq" data-i18n="h.nav.faq"></a>
            <a href="/app/" data-i18n="h.cta.short"></a>
          </nav>
        </div>
      </div>
    </footer>

    <script type="module" src="/src/landing.js"></script>
  </body>
</html>
