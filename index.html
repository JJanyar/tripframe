<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="google-site-verification" content="qwRuuv6yJwIumLH0zdr_8pfatkxHSnpb-L4ZI0nyHJY" />
    <meta name="theme-color" content="#17191E" />
    <title>Tripframe: every drive, frame by frame</title>
    <meta name="description" content="Open your dashcam's SD card in the browser. Every clip by day and time, front and rear in sync, frame by frame, with the route on a map. Free, no account, nothing is uploaded." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Tripframe" />
    <meta name="application-name" content="Tripframe" />
    <meta property="og:title" content="Tripframe" />
    <meta property="og:description" content="Every drive, frame by frame. Front and rear in sync, frame stepping, route on a map. Runs in your browser; nothing is uploaded." />
    <meta property="og:image" content="https://tripframe.vercel.app/video/tripframe.jpg" />
    <meta property="og:url" content="https://tripframe.vercel.app/" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="/favicon.ico?v=2" sizes="any" />
    <link rel="icon" href="/favicon.svg?v=2" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
    <link rel="manifest" href="/site.webmanifest" />
  </head>
  <body class="home">
    <!--nav-->

    <main>
      <section class="hero">
        <div class="hero-copy">
          <h1 class="display" data-i18n="h.hero.title"></h1>
          <p class="lead" data-i18n="h.hero.lead"></p>
          <div class="hero-actions">
            <a class="btn btn-primary btn-large" href="/app/" data-i18n="h.cta"></a>
            <a class="btn btn-large btn-quiet" href="#demo" data-i18n="h.cta.demo"></a>
          </div>
          <p class="hero-note" data-i18n="h.hero.note"></p>
        </div>
        <figure class="hero-video">
          <video id="hero-video" src="/video/tripframe.mp4" poster="/video/tripframe.jpg" width="1280" height="720" muted loop playsinline preload="metadata" data-i18n-attr="aria-label:h.video.label"></video>
          <button class="video-toggle" id="video-toggle" type="button"></button>
        </figure>
      </section>

      <section class="brands" aria-labelledby="brands-title">
        <h2 class="brands-title" id="brands-title" data-i18n="home.brands.label"></h2>
        <ul class="brand-list">
          <li><a href="/blog/viofo-dashcam-viewer/">Viofo</a></li>
          <li><a href="/blog/blackvue-dashcam-viewer/">BlackVue</a></li>
          <li><a href="/blog/thinkware-dashcam-viewer/">Thinkware</a></li>
          <li><a href="/blog/nextbase-dashcam-viewer/">Nextbase</a></li>
          <li><a href="/blog/70mai-dashcam-viewer/">70mai</a></li>
          <li><a href="/blog/garmin-dashcam-viewer/">Garmin</a></li>
          <li><a href="/blog/vantrue-dashcam-viewer/">Vantrue</a></li>
          <li><a href="/blog/tesla-dashcam-viewer/">Tesla</a></li>
          <li><a href="/dashcams/">GoPro</a></li>
        </ul>
        <p class="brands-note"><span data-i18n="home.brands.more"></span> <a href="/dashcams/" data-i18n="home.brands.link"></a></p>
      </section>

      <section class="demo-section" id="demo" aria-labelledby="demo-title">
        <div class="section-head">
          <h2 class="headline" id="demo-title" data-i18n="h.demo.heading"></h2>
          <p class="body-l" data-i18n="h.demo.caption"></p>
        </div>
        <figure class="demo">
          <iframe class="demo-app" id="demo-app" loading="lazy" data-i18n-attr="title:h.demo.label"></iframe>
        </figure>
      </section>

      <section class="moment" id="moment" aria-labelledby="moment-title">
        <div class="section-head">
          <h2 class="headline" id="moment-title" data-i18n="h.moment.title"></h2>
          <p class="body-l" data-i18n="h.moment.body"></p>
        </div>
        <ul class="decode" id="decode"></ul>
      </section>

      <section class="feature feature-sync" aria-labelledby="sync-title">
        <div class="feature-media pair">
          <img src="/photos/georgia-i75nb-mm86-2-dashcam.jpg" width="1600" height="900" alt="" data-i18n-attr="alt:h.alt.highway" loading="lazy" decoding="async" />
          <img src="/photos/sb-madison-highway-road-junction-ga-376.jpg" width="1600" height="900" alt="" data-i18n-attr="alt:h.alt.junction" loading="lazy" decoding="async" />
        </div>
        <div class="feature-copy">
          <h2 class="headline" id="sync-title" data-i18n="h.sync.title"></h2>
          <p class="body-l" data-i18n="h.sync.body"></p>
          <p class="keys"><button class="key" type="button" data-key="w" data-i18n-attr="title:h.keys.try"><kbd>W</kbd></button> <span data-i18n="h.sync.key"></span></p>
        </div>
      </section>

      <section class="feature feature-frame" aria-labelledby="frame-title">
        <div class="feature-copy">
          <h2 class="headline" id="frame-title" data-i18n="h.frame.title"></h2>
          <p class="body-l" data-i18n="h.frame.body"></p>
          <p class="keys"><button class="key" type="button" data-key="," data-i18n-attr="title:h.keys.try"><kbd>,</kbd></button> <button class="key" type="button" data-key="." data-i18n-attr="title:h.keys.try"><kbd>.</kbd></button> <span data-i18n="h.frame.key1"></span> <button class="key" type="button" data-key="s" data-i18n-attr="title:h.keys.try"><kbd>S</kbd></button> <span data-i18n="h.frame.key2"></span> <button class="key" type="button" data-key="r" data-i18n-attr="title:h.keys.try"><kbd>R</kbd></button> <span data-i18n="h.frame.key3"></span></p>
        </div>
        <div class="feature-media frames" id="frames">
          <img class="frames-big" src="/photos/sb-ne-colin-kelley-highway-at-ne.jpg" width="1600" height="900" alt="" data-i18n-attr="alt:h.alt.intersection" loading="lazy" decoding="async" />
          <div class="frame-strip" aria-hidden="true">
            <span style="--x: 40%"></span><span style="--x: 45%"></span><span class="on" style="--x: 50%"></span><span style="--x: 55%"></span><span style="--x: 60%"></span>
          </div>
        </div>
      </section>

      <section class="feature feature-map" aria-labelledby="map-title">
        <div class="feature-media route">
          <img src="/photos/sb-madison-highway-directional-road-sign-ga.jpg" width="1600" height="900" alt="" data-i18n-attr="alt:h.alt.sign" loading="lazy" decoding="async" />
          <div class="route-card force-dark" data-ui>
            <svg class="route-svg" viewBox="0 0 200 120" aria-hidden="true">
              <path class="route-path" d="M14 104 C 46 98, 52 70, 82 66 S 126 70, 140 46 S 170 18, 188 14" fill="none" />
              <circle class="route-dot" r="6" cx="14" cy="104" />
            </svg>
            <p class="route-speed"><span id="route-speed">0</span> <span class="unit" data-i18n="v.kmh"></span></p>
          </div>
        </div>
        <div class="feature-copy">
          <h2 class="headline" id="map-title" data-i18n="h.map.title"></h2>
          <p class="body-l" data-i18n="h.map.body"></p>
        </div>
      </section>

      <section class="more" id="more" aria-labelledby="more-title">
        <div class="section-head">
          <h2 class="headline" id="more-title" data-i18n="home.more.title"></h2>
          <p class="body-l" data-i18n="home.more.body"></p>
        </div>
        <ul class="more-grid">
          <li><a href="/features/#library"><span class="more-icon" data-icon="route"></span><h3 data-i18n="home.c1.t"></h3><p data-i18n="home.c1.b"></p></a></li>
          <li><a href="/features/#library"><span class="more-icon" data-icon="loud"></span><h3 data-i18n="home.c2.t"></h3><p data-i18n="home.c2.b"></p></a></li>
          <li><a href="/features/#playback"><span class="more-icon" data-icon="zoomIn"></span><h3 data-i18n="home.c3.t"></h3><p data-i18n="home.c3.b"></p></a></li>
          <li><a href="/features/#data"><span class="more-icon" data-icon="chart"></span><h3 data-i18n="home.c4.t"></h3><p data-i18n="home.c4.b"></p></a></li>
          <li><a href="/features/#map"><span class="more-icon" data-icon="addMarker"></span><h3 data-i18n="home.c5.t"></h3><p data-i18n="home.c5.b"></p></a></li>
          <li><a href="/features/#map"><span class="more-icon" data-icon="layers"></span><h3 data-i18n="home.c6.t"></h3><p data-i18n="home.c6.b"></p></a></li>
          <li><a href="/features/#export"><span class="more-icon" data-icon="clip"></span><h3 data-i18n="home.c7.t"></h3><p data-i18n="home.c7.b"></p></a></li>
          <li><a href="/features/#export"><span class="more-icon" data-icon="join"></span><h3 data-i18n="home.c8.t"></h3><p data-i18n="home.c8.b"></p></a></li>
        </ul>
        <a class="btn btn-large" href="/features/" data-i18n="home.more.link"></a>
      </section>

      <section class="compare" aria-labelledby="compare-title">
        <div class="compare-inner">
          <h2 class="display-2" id="compare-title" data-i18n="home.compare.title"></h2>
          <div class="compare-copy">
            <p class="body-l" data-i18n="home.compare.body"></p>
            <a class="btn btn-primary btn-large" href="/blog/free-dashcam-viewer-alternative/" data-i18n="home.compare.link"></a>
          </div>
        </div>
      </section>

      <section class="private" id="private" aria-labelledby="private-title">
        <div class="private-inner">
          <h2 class="display-2" id="private-title" data-i18n="h.private.title"></h2>
          <div class="private-cols">
            <p class="body-l"><span data-i18n="h.private.body"></span> <a class="text-link" href="/privacy/" data-i18n="home.private.link"></a></p>
            <ul class="private-list">
              <li data-i18n="h.private.p1"></li>
              <li data-i18n="h.private.p2"></li>
              <li data-i18n="h.private.p3"></li>
              <li data-i18n="h.private.p4"></li>
            </ul>
          </div>
        </div>
      </section>

      <section class="latest" aria-labelledby="latest-title">
        <div class="latest-head">
          <h2 class="headline" id="latest-title" data-i18n="home.blog.title"></h2>
          <a class="btn" href="/blog/" data-i18n="home.blog.all"></a>
        </div>
        <!--latest--><!--/latest-->
      </section>

      <section class="close">
        <h2 class="display" data-i18n="h.close.title"></h2>
        <a class="btn btn-primary btn-large" href="/app/" data-i18n="h.cta"></a>
      </section>
    </main>

    <!--footer-->

    <script type="module" src="/src/landing.js"></script>
  </body>
</html>
